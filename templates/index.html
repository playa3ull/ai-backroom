<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Discussion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            background-color: var(--bg-color);
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--card-bg);
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .main-content {
            flex: 1;
            display: flex;
            padding: 0;
            overflow: hidden;
        }
        
        .setup-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .setup-form {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        .sidebar {
            width: 300px;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border-color);
            padding: 40px 24px;
            overflow-y: auto;
        }
        
        .form-section {
            margin-bottom: 32px;
        }
        
        .agent-row {
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        
        .page-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 32px;
            color: var(--text-color);
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--muted-text);
            text-transform: uppercase;
        }
        
        .topic-input {
            font-size: 18px;
            padding: 12px 16px;
            border-radius: 8px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border-color);
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">AI Discussion</div>
    </div>
    
    <div class="main-content">
        <div class="setup-container">
            <div class="setup-form">
                <h1 class="page-title">Create a new discussion</h1>
                
                <form id="chatroomForm">
                    <div class="form-section">
                        <label for="topicTitle" class="form-label">Topic</label>
                        <input type="text" class="form-control form-control-lg topic-input" id="topicTitle" required placeholder="What would you like to discuss?">
                    </div>
                    
                    <div class="form-section">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <label class="form-label mb-0">Participants</label>
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="addAgentBtn">
                                Add Participant
                            </button>
                        </div>
                        <div id="agentsList">
                            <!-- Agent entries will be added here -->
                        </div>
                    </div>
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Create Discussion</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="section-title">Options</div>
            
            <div class="form-section">
                <label for="maxTurns" class="form-label">Maximum Turns</label>
                <input type="number" class="form-control" id="maxTurns" min="1" max="20" value="10">
                <div class="form-text">Limit how many turns the discussion will last</div>
            </div>
            
            <div class="form-section mt-4">
                <h6 class="mb-2">Available Tools</h6>
                <div class="card p-3 mb-2">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-search me-2"></i>
                        <strong>Search Tool</strong>
                    </div>
                    <p class="mb-0 small text-muted">
                        Enable web search capability for agents. When enabled, agents can search the web for information outside their knowledge base.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Agent Template (Hidden) -->
    <template id="agentTemplate">
        <div class="agent-row">
            <div class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control agent-name" required placeholder="Name">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Model</label>
                    <select class="form-select agent-model" required>
                        <optgroup label="OpenAI Models">
                            <option value="gpt-4o-mini">GPT-4o Mini</option>
                            <option value="gpt-4o">GPT-4o</option>
                        </optgroup>
                        <optgroup label="Gemini Models">
                            <option value="gemini-2.5-flash-preview-04-17">Gemini 2.5 Flash Preview</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                        </optgroup>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Role</label>
                    <input type="text" class="form-control agent-role" required placeholder="e.g., Digital Rights Theorist AI">
                </div>
                <div class="col-md-1">
                    <div class="form-check mt-4">
                        <input class="form-check-input agent-search-tool" type="checkbox" value="">
                        <label class="form-check-label" title="Enable web search capability">
                            <i class="bi bi-search"></i> Search
                        </label>
                    </div>
                </div>
                <div class="col-md-1 d-flex align-items-end justify-content-end">
                    <span class="remove-agent">✕</span>
                </div>
            </div>
        </div>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const agentsList = document.getElementById('agentsList');
            const addAgentBtn = document.getElementById('addAgentBtn');
            const agentTemplate = document.getElementById('agentTemplate');
            const chatroomForm = document.getElementById('chatroomForm');
            
            // Add initial agents
            addAgent();
            addAgent();
            
            // Add agent button click handler
            addAgentBtn.addEventListener('click', addAgent);
            
            // Form submission
            chatroomForm.addEventListener('submit', function(e) {
                e.preventDefault();
                createChatroom();
            });
            
            function addAgent() {
                const agentNode = agentTemplate.content.cloneNode(true);
                const removeBtn = agentNode.querySelector('.remove-agent');
                
                removeBtn.addEventListener('click', function() {
                    if (agentsList.children.length > 2) {
                        this.closest('.agent-row').remove();
                    } else {
                        alert('At least 2 participants are required for a discussion.');
                    }
                });
                
                agentsList.appendChild(agentNode);
            }
            
            function createChatroom() {
                const topicTitle = document.getElementById('topicTitle').value;
                const maxTurns = document.getElementById('maxTurns').value;
                
                // Collect agent data
                const agents = [];
                const agentRows = document.querySelectorAll('.agent-row');
                
                agentRows.forEach(row => {
                    agents.push({
                        name: row.querySelector('.agent-name').value,
                        model_type: row.querySelector('.agent-model').value,
                        role: row.querySelector('.agent-role').value,
                        use_search_tool: row.querySelector('.agent-search-tool').checked
                    });
                });
                
                // Create chatroom configuration
                const chatroomConfig = {
                    topic: {
                        title: topicTitle
                    },
                    agents: agents,
                    max_turns: parseInt(maxTurns)
                };
                
                // Send request to create chatroom
                fetch('/api/chatroom/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(chatroomConfig)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert('Error: ' + data.error);
                    } else {
                        window.location.href = '/chatroom/' + data.chatroom_id;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while creating the chatroom.');
                });
            }
        });
    </script>
</body>
</html>
